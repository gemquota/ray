<style>

<body>
<canvas id="view" aria-label="A psychedelic living scene explored by sensory rays and reconstructed from observations"></canvas>
<div id="readout">RAY / living perception</div><div id="hint">TAP · AIM / 1 FINGER · CIRCLE AROUND CENTRE TO ROTATE / 2 FINGERS · HORIZONTAL: RAYS, VERTICAL: SAMPLE RATE / 3-FINGER TAP · SHOW/HIDE ENTITIES</div><div id="stats"></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d',{alpha:true}),stats=document.getElementById('stats');
let W=0,H=0,dpr=1,angle=-Math.PI/2,targetAngle=-Math.PI/2,last=0,lastDraw=0,nextSample=0;
let fov=124,rayCount=1,pollingHz=120,elapsed=0;
let rayFrame=[];
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hues=[178,205,245,282,318,24,52,126];
const organisms=[];
const memories=new Map();
let entitiesVisible=false;
const hits=[];
const stars=Array.from({length:64},()=>({x:Math.random(),y:Math.random(),r:rand(.3,1.5),p:rand(0,TAU)}));
function makeOrganism(kind,u,v,scale,hue,group=0){
 const o={id:organisms.length,kind,u,v,scale,hue,phase:rand(0,TAU),speed:rand(.45,1.1),orbit:rand(0,TAU),rotation:rand(0,TAU),turn:rand(-1.35,1.35),group,seed:rand(0,1000),trail:[],children:[]};
 if(kind==='shoal'){o.count=rand(10,19)|0;o.members=Array.from({length:o.count},(_,i)=>({a:i/o.count*TAU+rand(-.3,.3),r:rand(.012,.055),p:rand(0,TAU),s:rand(.5,1.25)}))}
 organisms.push(o);return o;
}
makeOrganism('jelly',.21,.23,.072,190);
makeOrganism('shoal',.72,.22,.095,48,1);
makeOrganism('amoeba',.82,.69,.086,300);
makeOrganism('spiral',.20,.73,.075,145);
makeOrganism('urchin',.52,.78,.061,260);
makeOrganism('ribbon',.49,.12,.09,24);
makeOrganism('shoal',.91,.43,.072,190,2);
makeOrganism('cell',.37,.48,.05,330);
makeOrganism('jelly',.63,.49,.052,55);
makeOrganism('branch',.08,.48,.072,215);
makeOrganism('crystal',.91,.82,.068,28);
makeOrganism('colony',.08,.84,.078,165);
makeOrganism('torus',.88,.08,.064,285);
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,1.25);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);sample()}
function pos(o){return{x:(o.u-.5)*W,y:(o.v-.5)*H,r:o.scale*Math.min(W,H)}}
function hue(o,t=elapsed){return (o.hue+42*Math.sin(t*.42+o.phase)+24*Math.sin(t*.17+o.seed))%360}
function color(h,a=1){return 'hsla('+h+',100%,68%,'+a+')'}
function distanceToEdge(dx,dy){return Math.min(Math.abs(dx)>1e-8?(W/2)/Math.abs(dx):Infinity,Math.abs(dy)>1e-8?(H/2)/Math.abs(dy):Infinity)}
function rayCircle(ox,oy,dx,dy,o){const p=pos(o),x=ox-p.x,y=oy-p.y,b=x*dx+y*dy,c=x*x+y*y-p.r*p.r,q=b*b-c;if(q<0)return null;const t=-b-Math.sqrt(q);return t>=0?t:null}
function shapeContains(o,x,y){
 const p=pos(o),co=Math.cos(o.rotation),si=Math.sin(o.rotation),lx=(x-p.x)*co+(y-p.y)*si,ly=-(x-p.x)*si+(y-p.y)*co,r=p.r;
 if(o.kind==='shoal'){for(const m of o.members){const a=m.a+elapsed*(.65+o.speed*.2),rad=r*(.22+.48*(.5+.5*Math.sin(elapsed*.9+m.p))),fx=Math.cos(a)*rad,fy=Math.sin(a)*rad*.62,fr=r*.075*m.s;if(Math.hypot(lx-fx,ly-fy)<fr*1.8)return true}return false}
 const a=Math.atan2(ly,lx),d=Math.hypot(lx,ly)/r;
 if(o.kind==='jelly'){const nx=lx/(r*.62),ny=(ly+r*.05)/(r*.5);return ny<.15&&ny>-.95&&nx*nx+ny*ny<1}
 if(o.kind==='amoeba')return d<.58*(1+.2*Math.sin(a*5+o.phase+elapsed*.7)+.09*Math.sin(a*9-o.phase));
 if(o.kind==='urchin')return d<.55+.16*Math.cos(a*14+o.phase);
 if(o.kind==='ribbon'){const nx=lx/(r*1.45),wave=Math.sin(nx*9+elapsed*1.7+o.phase)*.2+Math.sin(nx*19-elapsed)*.08;return Math.abs(nx)<1&&Math.abs(ly/r-wave)<.16}
 if(o.kind==='spiral'){const target=.08+.42*((a+Math.PI)/(TAU));return Math.abs(d-target)<.065}
 if(o.kind==='cell'){const edge=.48*(1+.17*Math.cos(a*7+o.phase));return d<edge}
 if(o.kind==='branch'){const edge=.22+.20*Math.max(0,Math.cos(a*5+o.phase))+.17*Math.max(0,Math.cos(a*3-o.phase*1.4))+.08*Math.cos(a*11+o.phase);return d<edge}
 if(o.kind==='crystal'){const sides=7,sector=((a+Math.PI/sides)%(TAU/sides))-Math.PI/sides,edge=.58*Math.cos(Math.PI/sides)/Math.cos(sector);return d<edge*(.92+.08*Math.sin(a*17+o.phase))}
 if(o.kind==='colony'){const lobes=5+Math.floor(o.seed%4),edge=.32+.22*Math.pow(Math.max(0,Math.cos(a*lobes+o.phase)),2)+.10*Math.cos(a*2-o.phase);return d<edge}
 if(o.kind==='torus'){const ring=.34+.07*Math.sin(a*6+o.phase);return Math.abs(d-ring)<.12}
 return d<.5;
}
function rayHit(dx,dy,o){
 const p=pos(o),bound=p.r*(o.kind==='ribbon'?1.55:['branch','crystal','colony','torus'].includes(o.kind)?1.15:o.kind==='jelly'?.72:1),x=-p.x,y=-p.y,b=x*dx+y*dy,c=x*x+y*y-bound*bound,q=b*b-c;if(q<0)return null;
 const root=Math.sqrt(q),start=Math.max(0,-b-root),end=-b+root;if(end<0)return null;
 const steps=84,step=(end-start)/steps;
 for(let i=0;i<=steps;i++){const t=start+i*step;if(shapeContains(o,dx*t,dy*t))return t}
 return null;
}
function sample(){const half=fov/2*Math.PI/180,now=elapsed;rayFrame.length=0;for(let i=0;i<rayCount;i++){const off=(rayCount===1?0:(i/(rayCount-1)-.5)*2*half),dir=angle+off,dx=Math.cos(dir),dy=Math.sin(dir);let d=distanceToEdge(dx,dy),hit=null;for(const o of organisms){const t=rayHit(dx,dy,o);if(t!==null&&t<d){d=t;hit=o}}rayFrame.push({dx,dy,d,hit});if(hit){const center=pos(hit),wx=dx*d-center.x,wy=dy*d-center.y,co=Math.cos(hit.rotation),si=Math.sin(hit.rotation),lx=wx*co+wy*si,ly=-wx*si+wy*co,localAngle=(Math.atan2(ly,lx)+TAU)%TAU,bin=Math.round(localAngle/TAU*96)%96,model=memories.get(hit.id)||{id:hit.id,bins:Array(96).fill(null),h:hue(hit),lastSeen:now};const old=model.bins[bin],radius=Math.hypot(lx,ly)/center.r;model.bins[bin]=old===null?radius:old*.72+radius*.28;model.h=hue(hit);model.lastSeen=now;model.observations=(model.observations||0)+1;memories.set(hit.id,model);if(i%2===0){hits.push({x:dx*d,y:dy*d,h:hue(hit),time:now,id:hit.id});if(hits.length>180)hits.splice(0,hits.length-180)}}} 
function path(x,y,r,n,phase,warp=0){ctx.beginPath();for(let i=0;i<=n*3;i++){const a=i/(n*3)*TAU,rad=r*(1+warp*Math.sin(a*5+phase)+warp*.45*Math.sin(a*9-phase*1.3)),px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath()}
function glowCircle(x,y,r,h,a=1){ctx.save();ctx.shadowBlur=18;ctx.shadowColor=color(h,.9);ctx.fillStyle=color(h,a);ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore()}
function drawJelly(o,p,h,t){const pulse=1+.12*Math.sin(t*2.4+o.phase),r=p.r*.55*pulse;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(t*.55+o.phase)*.25);ctx.shadowBlur=22;ctx.shadowColor=color(h);ctx.fillStyle=color(h,.24);ctx.strokeStyle=color(h,.95);ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(0,-r*.12,r,r*.68,0,Math.PI,TAU);ctx.quadraticCurveTo(r*.8,r*.55,0,r*.48);ctx.quadraticCurveTo(-r*.8,r*.55,-r,r*.0);ctx.fill();ctx.stroke();for(let i=0;i<7;i++){const x=(i-3)*r*.22;ctx.beginPath();ctx.moveTo(x,r*.35);for(let k=1;k<=7;k++){const yy=r*.35+k*r*.19,xx=x+Math.sin(t*2+k*.8+i+o.phase)*r*.12;ctx.lineTo(xx,yy)}ctx.strokeStyle=color(h+35*i, .65);ctx.lineWidth=1.3;ctx.stroke()}ctx.restore()}
function drawShoal(o,p,h,t){const cx=p.x,cy=p.y;for(let i=0;i<o.members.length;i++){const m=o.members[i],a=m.a+t*(.65+o.speed*.2)+Math.sin(t*.7+m.p)*.22,rad=p.r*(.22+.48*(.5+.5*Math.sin(t*.9+m.p))),x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad*.62,rr=p.r*.075*m.s;ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillStyle=color(h+i*8,.78);ctx.shadowBlur=9;ctx.shadowColor=color(h+i*8);ctx.beginPath();ctx.moveTo(0,-rr*1.8);ctx.lineTo(rr,-rr*.2);ctx.lineTo(0,rr*1.8);ctx.lineTo(-rr,-rr*.2);ctx.closePath();ctx.fill();ctx.restore()}}
function drawAmoeba(o,p,h,t){const pulse=1+.18*Math.sin(t*1.4+o.phase);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t*.12*o.speed);path(0,0,p.r*.58*pulse,12,t+o.phase,.18);ctx.fillStyle=color(h,.18);ctx.strokeStyle=color(h,.9);ctx.lineWidth=2;ctx.shadowBlur=25;ctx.shadowColor=color(h);ctx.fill();ctx.stroke();for(let i=0;i<9;i++){const a=i*TAU/9+t*.22,r=p.r*.5;const x=Math.cos(a)*r,y=Math.sin(a)*r;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x*1.5+Math.sin(t+i)*p.r*.1,y*1.5,x*1.65,y*1.65);ctx.strokeStyle=color(h+i*9,.7);ctx.stroke();glowCircle(x*1.65,y*1.65,p.r*.045,h+i*9,.85)}ctx.restore()}
function drawSpiral(o,p,h,t){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t*.22+o.phase);ctx.strokeStyle=color(h,.9);ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor=color(h);ctx.beginPath();for(let i=0;i<96;i++){const a=i*.105,r=p.r*.008*i/4.7,x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();for(let i=0;i<6;i++){const a=i*TAU/6-t*.35;glowCircle(Math.cos(a)*p.r*.58,Math.sin(a)*p.r*.58,p.r*.07,h+i*18,.8)}ctx.restore()}
function drawUrchin(o,p,h,t){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t*.16);for(let i=0;i<28;i++){const a=i/28*TAU,r=p.r*.57,len=p.r*(.3+.13*Math.sin(t*2+i));ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.quadraticCurveTo(Math.cos(a+.1)*len*1.2,Math.sin(a+.1)*len*1.2,Math.cos(a)*len,Math.sin(a)*len);ctx.strokeStyle=color(h+i*4,.85);ctx.lineWidth=1.6;ctx.stroke()}glowCircle(0,0,p.r*.4,h,.35);ctx.restore()}
function drawRibbon(o,p,h,t){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.sin(t*.4+o.phase)*.6);for(let j=0;j<4;j++){ctx.beginPath();for(let i=0;i<=42;i++){const q=i/42,x=(q-.5)*p.r*2.7,y=Math.sin(q*TAU*2+t*1.7+j*.7+o.phase)*p.r*(.18+j*.035)+Math.sin(q*TAU*4-t+j)*p.r*.08;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle=color(h+j*22,.75);ctx.lineWidth=2.4-j*.35;ctx.shadowBlur=12;ctx.shadowColor=color(h+j*22);ctx.stroke()}ctx.restore()}
function drawCell(o,p,h,t){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t*.28);path(0,0,p.r*.52,7,o.phase,.2);ctx.fillStyle=color(h,.16);ctx.strokeStyle=color(h,.95);ctx.lineWidth=2;ctx.shadowBlur=20;ctx.shadowColor=color(h);ctx.fill();ctx.stroke();for(let i=0;i<5;i++){const a=i*TAU/5+t*.3;glowCircle(Math.cos(a)*p.r*.34,Math.sin(a)*p.r*.34,p.r*.1,h+i*16,.85)}ctx.restore()}
function drawOrganism(o){const p=pos(o),h=hue(o),t=elapsed;ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(p.x,p.y);ctx.rotate(o.rotation);ctx.translate(-p.x,-p.y);if(o.kind==='jelly')drawJelly(o,p,h,t);else if(o.kind==='shoal')drawShoal(o,p,h,t);else if(o.kind==='amoeba')drawAmoeba(o,p,h,t);else if(o.kind==='spiral')drawSpiral(o,p,h,t);else if(o.kind==='urchin')drawUrchin(o,p,h,t);else if(o.kind==='ribbon')drawRibbon(o,p,h,t);else drawCell(o,p,h,t);ctx.restore()}
function convexHull(points){if(points.length<3)return points;const p=points.slice().sort((a,b)=>a.x-b.x||a.y-b.y),cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x),lo=[],hi=[];for(const q of p){while(lo.length>1&&cross(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q)}for(let i=p.length-1;i>=0;i--){const q=p[i];while(hi.length>1&&cross(hi[hi.length-2],hi[hi.length-1],q)<=0)hi.pop();hi.push(q)}lo.pop();hi.pop();return lo.concat(hi)}
function drawReconstruction(){
 const visible=new Set(rayFrame.filter(r=>r.hit).map(r=>r.hit.id)),now=elapsed;
 ctx.save();ctx.globalCompositeOperation='screen';ctx.translate(W/2,H/2);
 for(const [id,m] of memories){
  const age=now-m.lastSeen,active=visible.has(id)||age<.42;
  if(!active){continue}
  const o=organisms[id],p=pos(o),co=Math.cos(o.rotation),si=Math.sin(o.rotation),fade=visible.has(id)?1:Math.max(0,1-age/.42),pts=[];
  for(let i=0;i<96;i++){
   const v=m.bins[i];if(v===null)continue;
   // Close small gaps between adjacent measured bearings, but do not invent an unseen far side.
   const prev=m.bins[(i+95)%96],next=m.bins[(i+1)%96];
   const radius=prev!==null&&next!==null?(prev+v*2+next)/4:v;
   const a=i/96*TAU,x=Math.cos(a)*radius*p.r,y=Math.sin(a)*radius*p.r;
   pts.push({index:i,x:p.x+x*co-y*si,y:p.y+x*si+y*co});
  }
  if(pts.length<3)continue;
  const ordered=pts.sort((a,b)=>a.index-b.index);
  ctx.beginPath();let begun=false;
  for(const q of ordered){if(!begun){ctx.moveTo(q.x,q.y);begun=true}else ctx.lineTo(q.x,q.y)}
  // Only close a silhouette once enough of its perimeter has actually been observed.
  if(ordered.length>=15)ctx.closePath();
  ctx.fillStyle=color(m.h,.055*fade);ctx.fill();
  ctx.strokeStyle=color(m.h,.78*fade);ctx.lineWidth=1.35;ctx.stroke();
  for(const q of ordered){ctx.beginPath();ctx.arc(q.x,q.y,1.25,0,TAU);ctx.fillStyle=color(m.h,.45*fade);ctx.fill()}
 }
 ctx.restore();
}
function draw(){ctx.clearRect(0,0,W,H);const t=elapsed,cx=W/2,cy=H/2;
if(entitiesVisible)for(const o of organisms)drawOrganism(o);
drawReconstruction();
ctx.save();ctx.translate(cx,cy);for(const ray of rayFrame){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ray.dx*ray.d,ray.dy*ray.d);ctx.strokeStyle=ray.hit?color(hue(ray.hit),.48):'rgba(105,210,255,.15)';ctx.lineWidth=ray.hit?1.05:.55;ctx.stroke()}ctx.restore();
ctx.save();ctx.globalCompositeOperation='lighter';for(let i=hits.length-1;i>=0;i--){const hit=hits[i],age=t-hit.time,alpha=Math.exp(-age*4.2);if(alpha<.035){hits.splice(i,1);continue}ctx.beginPath();ctx.arc(cx+hit.x,cy+hit.y,1.5+alpha*5,0,TAU);ctx.fillStyle=color(hit.h,alpha);ctx.shadowBlur=0;ctx.fill();ctx.beginPath();ctx.arc(cx+hit.x,cy+hit.y,3+age*11,0,TAU);ctx.strokeStyle=color(hit.h,alpha*.32);ctx.lineWidth=1;ctx.stroke()}ctx.restore();
ctx.save();ctx.translate(cx,cy);ctx.beginPath();ctx.arc(0,0,30,0,TAU);ctx.strokeStyle='rgba(160,190,255,.22)';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();ctx.arc(0,0,3,0,TAU);ctx.fillStyle='rgba(190,220,255,.8)';ctx.fill();ctx.restore();
}
function update(dt){elapsed+=dt;const delta=Math.atan2(Math.sin(targetAngle-angle),Math.cos(targetAngle-angle));angle+=delta*Math.min(1,dt*5.5);for(const o of organisms){o.phase+=dt*.15;const p=pos(o),drift=Math.sin(elapsed*.31+o.seed)*.0008;o.u+=Math.cos(elapsed*.27+o.phase)*dt*.006*o.speed+drift;o.v+=Math.sin(elapsed*.33+o.phase*1.3)*dt*.005*o.speed;if(o.u<.04||o.u>.96)o.u=clamp(o.u,.04,.96),o.phase+=Math.PI;if(o.v<.05||o.v>.95)o.v=clamp(o.v,.05,.95),o.phase+=Math.PI;
o.rotation+=dt*o.turn*(o.kind==='shoal'?1.35:1);if(o.kind==='shoal'){o.members.forEach(m=>m.a+=dt*(.1+Math.sin(elapsed+m.p)*.035))}}
}
function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;update(dt);if(now>=nextSample){sample();nextSample=now+1000/pollingHz}if(now-lastDraw>=1000/30){draw();lastDraw=now}requestAnimationFrame(frame)}
const pointers=new Map();let gesture=null;let tapCandidate=null;let threeTap=null;
function point(e){return{x:e.clientX,y:e.clientY}}
function pointerAngle(p){return Math.atan2(p.y-H/2,p.x-W/2)}
function twoState(){const p=[...pointers.values()];if(p.length<2)return null;return{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)}}
function refreshStats(){stats.textContent='RAYS '+rayCount+'  ·  RATE '+pollingHz+' Hz  ·  FOV '+Math.round(fov)+'°'+(entitiesVisible?'  ·  ENTITIES ON':'')}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();pointers.set(e.pointerId,point(e));if(pointers.size===1)tapCandidate={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};else tapCandidate=null;try{canvas.setPointerCapture(e.pointerId)}catch(_){}if(pointers.size===1)gesture={mode:'rotate',a:pointerAngle(point(e))};else if(pointers.size===2)gesture={mode:'two',state:twoState(),v:0,h:0};else if(pointers.size===3)threeTap={ids:new Set(pointers.keys()),start:new Map([...pointers].map(([id,p])=>[id,{...p}])),released:new Set(),moved:false};refreshStats()});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,point(e));if(threeTap&&threeTap.ids.has(e.pointerId)){const q=threeTap.start.get(e.pointerId);if(q&&Math.hypot(e.clientX-q.x,e.clientY-q.y)>12)threeTap.moved=true;}
